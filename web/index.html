<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<title>dumpbox</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--tx:#e8eaf0;--mut:#8b93a7;--ac:#6aa6ff;--ok:#4fcf8a;--bad:#ff6b6b}
@media(prefers-color-scheme:light){:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1e27;--mut:#5d6578;--ac:#2563eb;--ok:#15803d;--bad:#c62828}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
textarea,input,button{font:inherit;color:inherit;background:var(--card);border:1px solid #0003;border-radius:10px;padding:12px;width:100%}
textarea{min-height:130px;resize:vertical}
button{background:var(--ac);color:#fff;border:0;font-weight:600;margin-top:8px;cursor:pointer}
button.sec{background:var(--card);color:var(--tx);width:auto;margin:0;padding:6px 10px}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 6px}
.item{background:var(--card);border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;gap:10px;align-items:center}
.item.feito .t{text-decoration:line-through;color:var(--mut)}
.t{flex:1}.m{font-size:.8rem;color:var(--mut)}
.alta{border-left:4px solid var(--bad)}.media{border-left:4px solid var(--ac)}
#st{font-size:.85rem;color:var(--mut);margin-top:6px;min-height:1.2em}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{margin:0;background:var(--card);color:var(--mut)}.tabs button.on{background:var(--ac);color:#fff}
#msgs{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:55vh;overflow:auto}
.b{padding:10px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;word-break:break-word}
.b.u{background:var(--ac);color:#fff;align-self:flex-end}.b.a{background:var(--card)}
.b.prop{background:var(--card);border:1px dashed var(--ac);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.b.prop div{flex:1 1 100%}
#cbox{display:flex;gap:8px}#cbox textarea{min-height:48px;flex:1}#cbox button{width:auto;margin:0}
[hidden]{display:none!important}
</style>
</head>
<body><main>
<div id="prep" class="item" hidden></div>
<section id="setup" hidden>
  <h1>Bem-vindo ao dumpbox</h1>
  <p class="m">Crie a senha do app (mínimo 8 caracteres). Ela fica só neste PC.</p>
  <input id="nsenha" type="password" placeholder="nova senha" autocomplete="new-password">
  <input id="nsenha2" type="password" placeholder="repita a senha" autocomplete="new-password" style="margin-top:8px">
  <button id="criar">Criar senha e entrar</button><div id="serr" class="m"></div>
</section>
<section id="login" hidden>
  <h1>dumpbox</h1>
  <input id="senha" type="password" placeholder="senha" autocomplete="current-password">
  <button id="entrar">Entrar</button><div id="err" class="m"></div>
</section>
<section id="app" hidden>
  <div class="tabs"><button id="t-notas" class="on">Notas</button><button id="t-chat">Chat</button></div>
  <div id="aba-notas">
    <textarea id="txt" placeholder="Despeje tudo aqui, solto, misturado…"></textarea>
    <button id="guardar">Guardar</button>
    <div id="st"></div>
    <div id="lista"></div>
  </div>
  <div id="aba-chat" hidden>
    <div id="msgs"><div class="b a">Pergunte sobre suas notas ou peça mudanças ("marca a conta de luz como feita", "adia o dentista pra segunda"). Eu proponho, você confirma.</div></div>
    <div id="cbox"><textarea id="cmsg" placeholder="Mensagem…"></textarea><button id="cenviar">Enviar</button></div>
  </div>
  <p><button class="sec" id="sair">sair</button></p>
</section>
</main>
<script src="app.js"></script>
</body></html>
