name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: python tests/test_rules.py
      - run: python tests/test_api.py
      - run: pyinstaller --onefile --name dumpbox --paths backend --add-data "web;web" --collect-submodules uvicorn --collect-submodules dumpbox run.py
      - uses: actions/upload-artifact@v4
        with:
          name: dumpbox-windows
          path: dist/dumpbox.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/dumpbox.exe
